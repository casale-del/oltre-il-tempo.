
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oltre il tempo – Il presepe</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07142e;
      color: white;
      text-align: center;
    }
    #intro {
      position: absolute;
      z-index: 2;
      top: 12px;
      left: 0;
      right: 0;
      padding: 12px;
      pointer-events: none;
    }
    h1 { font-size: 23px; margin: 5px; }
    p { font-size: 14px; }
    #start {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      border: 0;
      border-radius: 12px;
      background: #f5c84b;
      color: #18213b;
      font-size: 18px;
      font-weight: bold;
    }
    a-scene { width: 100vw; height: 100vh; }
  </style>
</head>

<body>
  <div id="intro">
    <h1>OLTRE IL TEMPO</h1>
    <p>Inquadra la stella e scopri la sorpresa</p>
  </div>

  <button id="start">✨ INIZIA</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity position="0 0 0.1"
        animation="property: position; to: 0 0 0.8; dur: 1800; easing: easeOutCubic; loop: false">

        <a-octahedron
          color="#FFD54A"
          radius="0.35"
          material="emissive: #FFB300; emissiveIntensity: 1.5; metalness: 0.4; roughness: 0.25"
          animation="property: rotation; to: 0 360 0; dur: 5000; loop: true">
        </a-octahedron>

        <a-ring
          color="#FFE89A"
          radius-inner="0.42"
          radius-outer="0.48"
          material="shader: flat; opacity: 0.8; transparent: true"
          animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true">
        </a-ring>

        <a-sphere
          radius="0.08"
          color="#FFF5C2"
          position="0.55 0.35 0.1"
          material="emissive: #FFF0A0; emissiveIntensity: 1.5"
          animation="property: position; to: 0.55 0.65 0.1; dir: alternate; dur: 1400; loop: true">
        </a-sphere>

        <a-sphere
          radius="0.06"
          color="#FFF5C2"
          position="-0.5 -0.3 0.1"
          material="emissive: #FFF0A0; emissiveIntensity: 1.5"
          animation="property: position; to: -0.5 -0.55 0.1; dir: alternate; dur: 1100; loop: true">
        </a-sphere>

      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const button = document.querySelector("#start");
    button.addEventListener("click", async () => {
      button.style.display = "none";
      const system = document.querySelector("a-scene").systems["mindar-image-system"];
      await system.start();
    });
  </script>
</body>
</html>
